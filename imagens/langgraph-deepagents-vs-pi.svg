<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0EA5E9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#F6F7F9"/>

  <!-- Header -->
  <text x="640" y="50" text-anchor="middle" font-size="30" font-weight="800" fill="#0F172A">Ecossistema Aberto: Pi vs. LangGraph &amp; deepagents</text>
  <text x="640" y="80" text-anchor="middle" font-size="16" font-weight="500" fill="#475569">Dois caminhos open source (MIT, agnósticos a modelos) para explorar e construir harnesses</text>

  <!-- LEFT COLUMN: PI -->
  <g filter="url(#shadow)">
    <rect x="52" y="110" width="564" height="492" rx="16" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5"/>
    <rect x="52" y="110" width="564" height="52" rx="16" fill="#0D9488"/>
    <rect x="52" y="142" width="564" height="20" fill="#0D9488"/>
    <text x="78" y="144" font-size="18.5" font-weight="800" fill="#FFFFFF">1. Pi (pi-mono) — Minimalismo Radical</text>

    <!-- Layer 1 -->
    <rect x="78" y="184" width="512" height="104" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.5"/>
    <text x="98" y="210" font-size="14.5" font-weight="700" fill="#0F766E">Camada Opt-in: Extensões TS &amp; Skills</text>
    <text x="98" y="233" font-size="13" fill="#334155">AGENTS.md, Skills, pi.registerTool(), Hooks &amp; Pi Packages</text>
    <text x="98" y="255" font-size="12.5" font-weight="600" fill="#0D9488">Modos: TUI • Print/JSON • RPC • TypeScript SDK</text>

    <line x1="334" y1="288" x2="334" y2="308" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

    <!-- Layer 2 -->
    <rect x="78" y="312" width="512" height="106" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/>
    <text x="98" y="338" font-size="14.5" font-weight="800" fill="#0F172A">Núcleo: pi-agent-core + 4 Ferramentas</text>
    <text x="98" y="361" font-size="13" fill="#334155">Loop agêntico enxuto • System Prompt &lt; 1.000 tokens • Compactação</text>
    <rect x="98" y="376" width="84" height="28" rx="6" fill="#CCFBF1"/>
    <text x="140" y="395" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#0F766E">read</text>
    <rect x="192" y="376" width="84" height="28" rx="6" fill="#CCFBF1"/>
    <text x="234" y="395" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#0F766E">write</text>
    <rect x="286" y="376" width="84" height="28" rx="6" fill="#CCFBF1"/>
    <text x="328" y="395" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#0F766E">edit</text>
    <rect x="380" y="376" width="84" height="28" rx="6" fill="#CCFBF1"/>
    <text x="422" y="395" text-anchor="middle" font-size="12.5" font-weight="700" font-family="'JetBrains Mono', monospace" fill="#0F766E">bash</text>

    <line x1="334" y1="418" x2="334" y2="438" stroke="#0D9488" stroke-width="2" marker-end="url(#arrow-teal)"/>

    <!-- Layer 3 -->
    <rect x="78" y="442" width="512" height="82" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="98" y="468" font-size="14.5" font-weight="700" fill="#B45309">pi-ai — Abstração Multi-Provedor</text>
    <text x="98" y="491" font-size="13" fill="#78350F">Nuvem (OpenAI, Anthropic, Google) &amp; Locais (Ollama, llama.cpp)</text>
    <text x="98" y="511" font-size="12" font-weight="600" fill="#B45309">Troca de modelo em tempo real (/model)</text>

    <!-- Footer Pill -->
    <rect x="78" y="542" width="512" height="40" rx="20" fill="#0F172A"/>
    <text x="334" y="567" text-anchor="middle" font-size="13.5" font-weight="700" fill="#5EEAD4">Ideal como Raio-X: comece mínimo e acople sob medida</text>
  </g>

  <!-- RIGHT COLUMN: LANGCHAIN / LANGGRAPH / DEEPAGENTS -->
  <g filter="url(#shadow)">
    <rect x="664" y="110" width="564" height="492" rx="16" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.5"/>
    <rect x="664" y="110" width="564" height="52" rx="16" fill="#0EA5E9"/>
    <rect x="664" y="142" width="564" height="20" fill="#0EA5E9"/>
    <text x="690" y="144" font-size="18.5" font-weight="800" fill="#FFFFFF">2. LangChain / LangGraph &amp; deepagents</text>

    <!-- Layer 1: deepagents -->
    <rect x="690" y="184" width="512" height="114" rx="10" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="710" y="210" font-size="14.5" font-weight="800" fill="#0369A1">deepagents (Harness Oficial + CLI dcode)</text>
    <text x="710" y="233" font-size="13" fill="#334155">Camada "baterias inclusas" para tarefas longas e complexas:</text>
    <text x="710" y="255" font-size="12.5" font-weight="600" fill="#0369A1">• Planejamento (write_todos)  • Filesystem Virtual  • Subagentes</text>
    <text x="710" y="276" font-size="12.5" font-weight="600" fill="#0369A1">• Compressão de Contexto  • Memória (/memories/)  • Skills</text>

    <line x1="946" y1="298" x2="946" y2="318" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Layer 2: LangGraph -->
    <rect x="690" y="322" width="512" height="96" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="1.5"/>
    <text x="710" y="348" font-size="14.5" font-weight="700" fill="#0F172A">LangGraph — Runtime em Grafos (Stateful)</text>
    <text x="710" y="371" font-size="13" fill="#334155">Motor de execução de baixo nível com controle de estado:</text>
    <text x="710" y="394" font-size="12.5" font-weight="600" fill="#0369A1">Checkpointing durável • Streaming • Human-in-the-Loop nativo</text>

    <line x1="946" y1="418" x2="946" y2="438" stroke="#0EA5E9" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Layer 3: LangChain -->
    <rect x="690" y="442" width="512" height="82" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="710" y="468" font-size="14.5" font-weight="700" fill="#334155">LangChain — Framework Base (Python &amp; JS/TS)</text>
    <text x="710" y="491" font-size="13" fill="#475569">Abstrações de modelos, tool-calling, middleware e padrões de loop</text>
    <text x="710" y="511" font-size="12" font-weight="600" fill="#475569">Compatível com LLMs de fronteira, locais e servidores MCP</text>

    <!-- Footer Pill -->
    <rect x="690" y="542" width="512" height="40" rx="20" fill="#0F172A"/>
    <text x="946" y="567" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7DD3FC">Ideal p/ Grafos Persistentes: estrutura pronta em Python/TS</text>
  </g>

  <!-- BOTTOM SHARED BANNER -->
  <g filter="url(#shadow)">
    <rect x="52" y="624" width="1176" height="66" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="72" y="638" width="166" height="38" rx="8" fill="#0F172A"/>
    <text x="155" y="662" text-anchor="middle" font-size="13.5" font-weight="700" fill="#F8FAFC">Filosofia Comum</text>
    <text x="258" y="655" font-size="14.5" font-weight="700" fill="#0F172A">Código aberto (MIT) + Zero Vendor Lock-in + Controle Explícito sobre o Harness</text>
    <text x="258" y="676" font-size="13" fill="#475569">Ambos separam a inteligência (LLM) da infraestrutura ao redor (contexto, ferramentas, estado e verificação).</text>
  </g>
</svg>
